name: Release
# A tag equal to manifest.json's version (as `npm version` makes, without a "v") publishes a
# release with the three files Obsidian installs.
on:
  push:
    tags: ["*.*.*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches the manifest
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      # Signed build provenance, so anyone can check the files came from this repository's
      # source: `gh attestation verify main.js --repo code-ministry-ltd/the-archivist-obsidian`.
      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
